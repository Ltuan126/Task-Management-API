name: CI / CD

on:
  push:
    branches: [main, develop]
    paths:
      - "backend-clean-api/**"
      - "task-dashboard/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend-clean-api/**"
      - "task-dashboard/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Run backend tests (always)
  # ──────────────────────────────────────────────────────────────
  test:
    name: Test (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-clean-api

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-clean-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          JWT_SECRET: ci-secret-key
          NODE_ENV: test
        run: npm test

  # ──────────────────────────────────────────────────────────────
  # Job 2: Lint, typecheck, and test the dashboard (always)
  # ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-dashboard

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Vite 8 requires ^20.19.0 || >=22.12.0 — 22 keeps a clear margin.
          node-version: 22
          cache: npm
          cache-dependency-path: task-dashboard/package-lock.json

      - name: Pin npm version
        # `npm ci`'s lockfile-consistency check isn't stable across npm majors:
        # npm 11 (used to regenerate package-lock.json) omits some optional
        # peer-dependency entries that npm 10 requires, so whatever npm ships
        # with the runner's Node build can fail `npm ci` on a lockfile that
        # installs fine locally. Pin to the version the lockfile is
        # maintained against so this can't drift silently.
        run: npm install -g npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        # `build` is `tsc -b && vite build`, so this covers both.
        run: npm run build

      - name: Run tests
        run: npm test

  # ──────────────────────────────────────────────────────────────
  # Job 3: Deploy to Render PRODUCTION (main branch only)
  # Requires secret: RENDER_DEPLOY_HOOK_PROD
  # ──────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production (Render)
    # One pipeline, one verdict — a red dashboard blocks the ship too.
    needs: [test, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Trigger Render production deploy hook
        env:
          RENDER_DEPLOY_HOOK_PROD: ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
        if: ${{ env.RENDER_DEPLOY_HOOK_PROD != '' }}
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --request POST \
            "$RENDER_DEPLOY_HOOK_PROD")

          if [[ "$HTTP_STATUS" =~ ^2 ]]; then
            echo "✅ Production deploy triggered (HTTP $HTTP_STATUS)"
          else
            echo "❌ Deploy hook returned HTTP $HTTP_STATUS"
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────
  # Job 4: Deploy to Render STAGING (develop branch only)
  # Requires secret: RENDER_DEPLOY_HOOK_STAGING
  # ──────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging (Render)
    needs: [test, frontend]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Trigger Render staging deploy hook
        env:
          RENDER_DEPLOY_HOOK_STAGING: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}
        if: ${{ env.RENDER_DEPLOY_HOOK_STAGING != '' }}
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --request POST \
            "$RENDER_DEPLOY_HOOK_STAGING")

          if [[ "$HTTP_STATUS" =~ ^2 ]]; then
            echo "✅ Staging deploy triggered (HTTP $HTTP_STATUS)"
          else
            echo "❌ Deploy hook returned HTTP $HTTP_STATUS"
            exit 1
          fi
